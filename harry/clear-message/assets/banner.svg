  </g>
  <text x="313" y="221" text-anchor="middle" fill="#a7cce6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">READ</text>
  <text x="647" y="221" text-anchor="middle" fill="#cdb9e9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2">WRITE</text>
  <text x="480" y="260" text-anchor="middle" fill="#c9d6ec" fill-opacity=".75" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing=".7">Understand what matters. Say what you mean.</text>
</svg>
